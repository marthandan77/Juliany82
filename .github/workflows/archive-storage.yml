name: Archive EIA natural gas storage

on:
  schedule:
    - cron: "30 17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python collect_storage.py
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      - name: Commit a new EIA vintage if the source changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/raw/eia_storage
          if ! git diff --cached --quiet; then
            git commit -m "Archive EIA natural gas storage vintage"
            git push
          fi
